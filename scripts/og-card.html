<!doctype html>
<!-- Link-preview card. Regenerate src/assets/og.png with `node scripts/og-card.mjs`. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 0 96px;
        background: #fcfcfb;
        color: #171717;
        font-family: Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      img {
        width: 300px;
        height: 300px;
        flex: none;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 0 1px #e4e4e1;
      }
      h1 { font-size: 84px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
      p { margin-top: 20px; font-size: 38px; color: #5c5c5c; }
      .url { margin-top: 48px; padding-top: 28px; border-top: 2px solid #e4e4e1; font-size: 30px; color: #171717; }
    </style>
  </head>
  <body>
    <img src="../src/assets/edwin.jpg" alt="" />
    <div>
      <h1>Edwin Cortazo</h1>
      <p>Software engineer · New York</p>
      <p class="url">edwincortazo.com</p>
    </div>
  </body>
</html>
